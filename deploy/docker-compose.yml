services:
  website:
    image: nginx:alpine
    container_name: danshi-website
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"

      # www.fdueat.com — serve the website
      - "traefik.http.routers.danshi-www.rule=Host(`www.fdueat.com`)"
      - "traefik.http.routers.danshi-www.entrypoints=websecure"
      - "traefik.http.routers.danshi-www.tls=true"
      - "traefik.http.routers.danshi-www.tls.certresolver=le"
      - "traefik.http.routers.danshi-www.service=danshi-website"
      - "traefik.http.services.danshi-website.loadbalancer.server.port=80"

      # fdueat.com — 302 redirect to www.fdueat.com
      - "traefik.http.routers.danshi-apex.rule=Host(`fdueat.com`)"
      - "traefik.http.routers.danshi-apex.entrypoints=websecure"
      - "traefik.http.routers.danshi-apex.tls=true"
      - "traefik.http.routers.danshi-apex.tls.certresolver=le"
      - "traefik.http.routers.danshi-apex.middlewares=apex-redirect"
      - "traefik.http.routers.danshi-apex.service=danshi-website"
      - "traefik.http.middlewares.apex-redirect.redirectregex.regex=^https://fdueat\\.com(.*)"
      - "traefik.http.middlewares.apex-redirect.redirectregex.replacement=https://www.fdueat.com$${1}"
      - "traefik.http.middlewares.apex-redirect.redirectregex.permanent=false"
    networks:
      - edge

networks:
  edge:
    external: true
